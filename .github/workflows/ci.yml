name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      AZURE_AI_ENDPOINT: https://example.services.ai.azure.com
      AZURE_AI_SEARCH_ENDPOINT: https://example.search.windows.net
      AZURE_CONTENT_UNDERSTANDING_ENDPOINT: https://example.cognitiveservices.azure.com
      PDF_CACHE_ACCOUNT_URL: https://example.blob.core.windows.net
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            src/pdf-processor/requirements.txt
            ui/requirements.txt
      - uses: azure/setup-bicep@v2
      - run: python -m pip install -r src/pdf-processor/requirements.txt -r ui/requirements.txt
      - run: python -m unittest discover -s src/pdf-processor -p "test_*.py"
      - run: python -m py_compile src/ahjo-meetings/main.py src/pdf-processor/function_app.py scripts/index_strategy.py ui/app.py ui/cache_db.py
      - run: bicep build infra/main.bicep